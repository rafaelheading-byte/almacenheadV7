<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEAD STORE — Productos</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>
    <div class="main-content">
      <div class="topbar">
        <span class="topbar-title">// PRODUCTOS</span>
        <div class="topbar-actions">
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" placeholder="Buscar..." />
          </div>
          <select id="filter-category" class="field-input" style="width:160px;">
            <option value="">Todas las categorías</option>
          </select>
          <!-- Botón solo para ADMIN y SUPERVISOR -->
          <button id="btn-new-product" class="btn btn-primary" onclick="openCreate()" style="display:none;">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Nuevo Producto
          </button>
        </div>
      </div>

      <div class="page-content">
        <!-- Aviso de solo lectura para STOREKEEPER -->
        <div id="readonly-notice"
          style="display:none; margin-bottom:16px; padding:12px 16px; background:#f0f4ff; border:1px solid #b0c4de; border-radius:4px; font-size:0.82rem; color:#2a4a7a;">
          <strong>ℹ Vista de catálogo:</strong> Puedes consultar el catálogo de productos. Para crear o modificar
          productos contacta a un administrador.
        </div>

        <div class="table-card">
          <div class="table-header">
            <h3>Catálogo de Productos</h3>
            <span id="record-count" class="text-muted"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Nombre</th>
                  <th>Categoría</th>
                  <th>Unidad</th>
                  <th>Stock Mín.</th>
                  <th>Estado</th>
                  <th>Creado</th>
                  <th id="actions-col"></th>
                </tr>
              </thead>
              <tbody id="products-body">
                <tr>
                  <td colspan="8">
                    <div class="page-loader">
                      <div class="spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal Crear/Editar (solo ADMIN/SUPERVISOR) -->
  <div class="modal-overlay" id="modal-product">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">Nuevo Producto</h3>
        <button class="btn btn-ghost btn-icon" onclick="Modal.close('modal-product')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="prod-id" />
        <div class="form-row cols-2">
          <div>
            <label class="field-label">Código *</label>
            <input type="text" id="prod-code" class="field-input" placeholder="PROD-001" />
          </div>
          <div>
            <label class="field-label">Categoría</label>
            <select id="prod-category" class="field-input">
              <option value="">Sin categoría</option>
            </select>
          </div>
        </div>
        <div class="mt-4">
          <label class="field-label">Nombre *</label>
          <input type="text" id="prod-name" class="field-input" placeholder="Nombre del producto" />
        </div>
        <div class="mt-4">
          <label class="field-label">Descripción</label>
          <textarea id="prod-desc" class="field-input" placeholder="Descripción opcional..."></textarea>
        </div>
        <div class="form-row cols-2 mt-4">
          <div>
            <label class="field-label">Unidad *</label>
            <input type="text" id="prod-unit" class="field-input" placeholder="pza, kg, m, lt..." />
          </div>
          <div>
            <label class="field-label">Stock Mínimo</label>
            <input type="number" id="prod-minstock" class="field-input" min="0" value="0" />
          </div>
        </div>
        <div class="mt-4">
          <label class="field-label">URL Imagen</label>
          <input type="text" id="prod-image" class="field-input" placeholder="https://..." />
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="Modal.close('modal-product')">Cancelar</button>
        <button class="btn btn-primary" id="btn-prod-save">Guardar</button>
      </div>
    </div>
  </div>

  <!-- Modal Confirmar -->
  <div class="modal-overlay" id="modal-confirm">
    <div class="modal" style="max-width:380px;">
      <div class="modal-header">
        <h3>Confirmar acción</h3>
      </div>
      <div class="modal-body">
        <p id="confirm-msg" style="font-size:0.9rem; color:#444;"></p>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="Modal.close('modal-confirm')">Cancelar</button>
        <button class="btn btn-danger" id="btn-confirm-ok">Confirmar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../pages_js/product.js"></script>
</body>

</html>
