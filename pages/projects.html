<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEAD STORE — Proyectos</title>
  <link rel="stylesheet" href="../css/styles.css" />
</head>

<body>
  <div class="app-layout">
    <aside class="sidebar"></aside>
    <div class="main-content">
      <div class="topbar">
        <span class="topbar-title">// TIPOS DE SALIDA

        </span>
        <div class="topbar-actions">
          <div class="search-bar">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="8" />
              <line x1="21" y1="21" x2="16.65" y2="16.65" />
            </svg>
            <input type="text" id="search-input" placeholder="Buscar proyecto..." />
          </div>
          <button class="btn btn-primary" onclick="openCreate()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
              <line x1="12" y1="5" x2="12" y2="19" />
              <line x1="5" y1="12" x2="19" y2="12" />
            </svg>
            Nuevo Proyecto
          </button>
        </div>
      </div>
      <div class="page-content">
        <div class="table-card">
          <div class="table-header">
            <h3>Proyectos</h3>
            <span id="record-count" class="text-muted"></span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Código</th>
                  <th>Nombre</th>
                  <th>Supervisor</th>
                  <th>Dirección</th>
                  <th>Estado</th>
                  <th>Creado</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="projects-body">
                <tr>
                  <td colspan="7">
                    <div class="page-loader">
                      <div class="spinner"></div>
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal-overlay" id="modal-project">
    <div class="modal">
      <div class="modal-header">
        <h3 id="modal-title">NUEVA SALIDA</h3>
        <button class="btn btn-ghost btn-icon" onclick="Modal.close('modal-project')">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <line x1="18" y1="6" x2="6" y2="18" />
            <line x1="6" y1="6" x2="18" y2="18" />
          </svg>
        </button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="proj-id" />
        <div class="form-row cols-2">
          <div>
            <label class="field-label">Código *</label>
            <input type="text" id="proj-code" class="field-input" placeholder="OBR-001" />
          </div>
          <div>
            <label class="field-label">Nombre *</label>
            <input type="text" id="proj-name" class="field-input" placeholder="Edificio Torre Norte" />
          </div>
        </div>
        <div class="mt-4">
          <label class="field-label">Supervisor</label>
          <input type="text" id="proj-supervisor" class="field-input" placeholder="Nombre del supervisor" />
        </div>
        <div class="mt-4">
          <label class="field-label">Dirección de Obra</label>
          <textarea id="proj-address" class="field-input" placeholder="Dirección completa..."></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" onclick="Modal.close('modal-project')">Cancelar</button>
        <button class="btn btn-primary" id="btn-proj-save">Guardar</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../js/config.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../pages_js/process.js"></script>

</body>

</html>
