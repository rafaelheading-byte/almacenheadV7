<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>HEAD STORE — Acceso</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>

<body>

  <div class="login-page">
    <!-- Brand Panel -->
    <div class="login-brand">
      <div class="logo-mark">
        <img src="./img/LOGO OK.jpg" alt="LOGO" style="width:120px; height:120px; border-radius:4px; background:#fff; ">
      </div>
      <h1>HEAD<br />STORE</h1>
      <p>Sistema profesional<br />de gestión de inventarios</p>
      <div class="version-tag">v5.4.0 · HEAD STORE </div>
    </div>

    <!-- Form Area -->
    <div class="login-form-area">
      <div class="login-card">
        <h2>// INICIAR SESIÓN</h2>

        <div id="login-error" class="login-error">
          <span id="login-error-msg">Credenciales incorrectas</span>
        </div>

        <div class="form-group">
          <label for="email">Correo electrónico</label>
          <input type="email" id="email" placeholder="usuario@empresa.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" placeholder="••••••••" autocomplete="current-password" />
        </div>

        <button class="btn-login" id="btn-login">ENTRAR</button>

        <p style="margin-top:20px; font-size:0.72rem; color:#555; text-align:center;">
          Default: user@headstore.com ·
        </p>
      </div>
    </div>
  </div>

  <!-- Scripts -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    if (Auth.getUser()) window.location.href = "pages/inventory.html";

    const btnLogin = document.getElementById("btn-login");
    const errorBox = document.getElementById("login-error");
    const errorMsg = document.getElementById("login-error-msg");

    async function doLogin() {
      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      if (!email || !password) {
        errorMsg.textContent = "Completa todos los campos.";
        errorBox.classList.add("show");
        return;
      }

      btnLogin.disabled = true;
      btnLogin.textContent = "VERIFICANDO...";
      errorBox.classList.remove("show");

      try {
        await Auth.login(email, password);
        window.location.href = "pages/inventory.html";

      } catch (err) {
        errorMsg.textContent = err.message || "Error de autenticación.";
        errorBox.classList.add("show");
        btnLogin.disabled = false;
        btnLogin.textContent = "ENTRAR";
      }
    }

    btnLogin.addEventListener("click", doLogin);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Enter") doLogin();
    });
  </script>
</body>

</html>
